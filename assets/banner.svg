<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #cbd5e1;
    }

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1.5deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite 1s;
      transform-origin: 1000px 250px;
    }
    .floating-card-1 {
      animation: floatSlow1 5s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: floatSlow2 6s ease-in-out infinite 0.5s;
      transform-origin: center;
    }
    .animated-wire {
      stroke-dasharray: 8, 8;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Geometric Grid Accent Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background (will not obscure foreground) -->
  <circle class="pulse-orb-1" cx="180" cy="90" r="120" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle class="pulse-orb-2" cx="1020" cy="270" r="140" fill="#db2777" opacity="0.2" filter="url(#glow)" />

  <!-- Flow lines / wires in background -->
  <path class="animated-wire" d="M 120 280 C 350 330, 850 330, 1080 280" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.35" />

  <!-- Foreground Elements: Left decorative dynamic card (positioned safely) -->
  <g class="floating-card-1" opacity="0.85">
    <g transform="translate(70, 70)">
      <rect width="180" height="95" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="30" r="12" fill="#10b981" />
      <text x="23" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">%</text>
      <text x="48" y="34" class="pill-text" font-weight="bold" fill="#f8fafc">DISCOUNT -30%</text>
      <line x1="20" y1="52" x2="160" y2="52" stroke="#334155" stroke-dasharray="4,4" />
      <text x="20" y="74" class="pill-text" fill="#94a3b8">CODE: PROMO2026</text>
    </g>
  </g>

  <!-- Foreground Elements: Right decorative dynamic card (positioned safely) -->
  <g class="floating-card-2" opacity="0.85">
    <g transform="translate(950, 70)">
      <rect width="180" height="95" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="30" r="12" fill="#f59e0b" />
      <text x="24" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">★</text>
      <text x="48" y="34" class="pill-text" font-weight="bold" fill="#f8fafc">LOYALTY TIER</text>
      <line x1="20" y1="52" x2="160" y2="52" stroke="#334155" stroke-dasharray="4,4" />
      <text x="20" y="74" class="pill-text" fill="#38bdf8">1,250 PTS EARNED</text>
    </g>
  </g>

  <!-- High-Contrast Prominent Center Content (Always in Foreground) -->
  <!-- Category Pill Badge -->
  <g transform="translate(460, 42)">
    <rect width="280" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="140" y="20" text-anchor="middle" class="badge-text" fill="#a5b4fc">🎁 PROMOTION &amp; LOYALTY TECH</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(600, 125)">
    <text text-anchor="middle" class="title-text">Awesome Promotion, Coupon &amp;</text>
    <text text-anchor="middle" y="48" class="title-text" fill="url(#accentGrad)">Discount Management</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 215)">
    <text text-anchor="middle" class="subtitle-text">
      Curated directory of SaaS promotion engines, coupon validators &amp; open-source loyalty architectures
    </text>
  </g>

  <!-- Bottom Pills (Technology Highlights) -->
  <g transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="72.5" y="21" text-anchor="middle" class="pill-text">⚡ Rules Engines</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-155, 0)">
      <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="72.5" y="21" text-anchor="middle" class="pill-text">🏷️ Coupon Codes</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="72.5" y="21" text-anchor="middle" class="pill-text">🏆 Loyalty Points</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(175, 0)">
      <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="72.5" y="21" text-anchor="middle" class="pill-text">🚀 Headless APIs</text>
    </g>
  </g>

  <!-- Subtle bottom glowing bar -->
  <rect x="350" y="348" width="500" height="4" rx="2" fill="url(#accentGrad)" />
</svg>